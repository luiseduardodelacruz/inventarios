<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/img/logo-navegador.png" type="Logo para el navegador">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" type="text/css" href="/css/ficha-hibilitacion.css">
    <title>Fichas Habilitación - Parte 1</title>
</head>

<body>
    <div class="bg-[#ffe1d2]">
        <div class="flex justify-center items-center min-h-screen">

            <div class=" max-w-3xl lg:max-w-4xl p-6 border-[#db4900] border-opacity-40 rounded-3xl shadow sm:p-6 md:p-8 bg-opacity-40 bg-[#db4900] p-[10vw] m-[10vw]">
                <form id="formulario" class="space-y-6" th:action="@{/guardar-ficha-parte1}"
                    th:object="${fichaHabilitacion}" method="post">
                    <!-- Primera fila -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-5">
                        <!-- Checkbox personalizado -->
                        <div class="relative flex items-center mb-3">
                            <label class="inline-flex items-center  cursor-pointer">
                              <input type="checkbox" value="" class="sr-only peer" checked>
                              <div class="relative p-[1vw] w-[60vw] h-[8vh] sm:w-[36vw] md:w-[34vw] sm:h-[8vh] md:h-[8vh] lg:p-[1vw] lg:w-[32vw] lg:h-[8vh] xl:p-[1vw] xl:w-[26vw] xl:h-[8vh] 2xl:p-[1vw] 2xl:w-[21vw] 2xl:h-[8vh] bg-[#db4900] peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-[#e8763d] dark:peer-focus:ring-[#e8763d] rounded-xl peer dark:bg-white-700 rtl:peer-checked:after:-translate-x-full peer-checked:after:border-[#e8763d] after:absolute after:bg-[#e8763d] after:border-[#e8763d] after:border after:rounded-xl after:rounded-full after:w-[28vw] after:h-[7vh] sm:after:h-[7vh] md:after:h-[7vh] lg:after:h-[7vh] xl:after:h-[7vh] 2xl:after:h-[7vh] after:p-[1vw] after:my-1.5 after:mr-[5vw] after:mb-1.5 after:mx-50 after:transition-all dark:border-gray-600 peer-checked:bg-[#db4900] after:top-[-0.35vw] sm:after:top-[-2px] md:after:top-[-2px] 2xl:after:top-[-0.5px] peer-checked:after:translate-x-[30vw] sm:peer-checked:after:translate-x-[18vw] md:peer-checked:after:translate-x-[16vw] lg:peer-checked:after:translate-x-[14vw] xl:peer-checked:after:translate-x-[12vw] 2xl:peer-checked:after:translate-x-[9.6vw] sm:after:w-[16vw] md:after:w-[16vw] lg:after:w-[16vw] xl:after:w-[12vw] 2xl:after:w-[10vw]"></div>
                            </label>
                            <div class="absolute inset-0 flex pointer-events-none justify-content items-center mb-3 mt-3">
                              <span class="fuente_1  text-sm sm:text-base font-bold text-center  md:text-md text-white dark:text-white ml- w-[50vw]">Ficha tecnica</span>
                              <span class="fuente_1 text-sm sm:text-base font-bold text-center md:text-md text-white dark:text-white md:mr-2 w-[50vw]">Corte</span>
                            </div>
                        </div>

                        <div class="flex items-center mb-3 sm:mb-0">
                            <label for="fecha" class="text-sm sm:text-base font-bold w-[94%] sm:w-[60%] text-white-900 text-white">Fecha
                                actual:</label>
                            <input type="date" id="fecha" name="fecha"
                            class="bg-[#db4900] border border-orange-300 text-white-900 text-xs sm:text-sm font-bold  rounded-3xl focus:ring-orange-500 focus:border-orange-500 block w-full lg:w-[79%] sm:w-full sm:ml-[4%] sm:text-sm md:text-xs sm:text-sm p-2.5 dark:bg-orange-600 border-orange-500 placeholder-orange-400 text-white"
                                th:field="*{fecha}" required>
                        </div>
                    </div>

                    <!-- Segunda fila -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div class="flex items-center mb-3">
                            <label for="estilo"
                                class="text-sm sm:text-base font-bold w-[95%] sm:w-[55%]  text-white-900 text-white">Estilo:</label>
                            <input type="text" name="estilo" id="estilo"
                                class="bg-[#db4900] border-orange-300 text-gray-900 text-xs sm:text-sm font-bold  rounded-3xl focus:ring-orange-500 focus:border-orange-500 block w-full sm:w-full sm:ml-[4%] sm:text-sm md:text-xs sm:text-sm p-2.5 dark:bg-orange-600 border-orange-500 placeholder-white-400 text-white placeholder-white"
                                th:field="*{estilo}" required>
                        </div>
                        <div class="flex items-center mb-3">
                            <label for="corte" class="text-sm sm:text-base font-bold w-[95%] sm:w-[60%] text-gray-900 text-white">Corte:</label>
                            <input type="text" name="corte" id="corte"
                                class="bg-[#db4900] border-orange-300 text-gray-900 text-xs sm:text-sm font-bold  rounded-3xl focus:ring-orange-500 focus:border-orange-500 block w-full sm:w-full lg:w-[78%] sm:ml-[4%] sm:text-sm md:text-xs sm:text-sm p-2.5 dark:bg-orange-600 border-orange-500 placeholder-white-400 text-white placeholder-white"
                                th:field="*{corte}" required>
                        </div>
                        <div class="flex items-center mb-3">
                            <label for="tipos" class="text-sm sm:text-base font-bold w-[100%] sm:w-[60%] text-gray-900 text-white mr-2">Tipo de corte:
                            </label>
                            <select name="tipos" id="tipos"
                                class="bg-[#db4900] border-orange-300 text-gray-900 text-xs sm:text-sm font-bold  rounded-3xl focus:ring-orange-500 focus:border-orange-500 block w-full sm:w-full sm:ml-[4%] sm:text-sm md:text-xs sm:text-sm p-2.5 dark:bg-orange-600 border-orange-500 placeholder-white-400 text-white"
                                th:field="*{tipos}" required>
                                <option value="" selected>Seleccionar tipo de corte</option>
                                <option th:each="tipos : ${tipos}" th:value="${tipos.guy}" th:text="${tipos.guy}">Tipo
                                </option>
                            </select>
                        </div>
                        <div class="flex items-center mb-3">
                            <label for="etapas" class="text-sm sm:text-base font-bold w-[100%] sm:w-[60%] mr-2 sm:mr-0 text-gray-900 text-white">Etapas de
                                corte:
                            </label>
                            <select name="etapas" id="etapas"
                                class="bg-[#db4900] border-orange-300 text-gray-900 text-xs sm:text-sm font-bold  rounded-3xl focus:ring-orange-500 focus:border-orange-500 block w-full lg:w-[75%] sm:w-full sm:ml-[4%] sm:text-sm md:text-xs sm:text-sm p-2.5 dark:bg-orange-600 border-orange-500 placeholder-white-400 text-white placeholder-white"
                                th:field="*{etapas}" required>
                                <option value="" selected>Seleccionar tipo de corte</option>
                                <option th:each="etapas : ${etapas}" th:value="${etapas.etapa}"
                                    th:text="${etapas.etapa}">Etapas del corte
                                </option>
                            </select>
                        </div>
                        <div class="flex items-center mb-3">
                            <label for="cadena"
                                class="text-sm sm:text-base font-bold w-[100%] sm:w-[60%]  text-gray-900 text-white mr-2">Cadena:</label>
                            <select name="cadena" id="cadena"
                                class="bg-[#db4900] border-orange-300 text-gray-900 text-xs sm:text-sm font-bold  rounded-3xl focus:ring-orange-500 focus:border-orange-500 block w-full sm:w-full sm:ml-[4%] sm:text-sm md:text-xs sm:text-sm p-2.5 dark:bg-orange-600 border-orange-500 placeholder-white-400 text-white"
                                th:field="*{cadena}" required>
                                <option value="" selected>Seleccionar cadena</option>
                                <option th:each="cadena : ${cadenas}" th:value="${cadena.name_chain}"
                                    th:text="${cadena.name_chain}">Cadena</option>
                            </select>
                        </div>
                        <div class="flex items-center mb-3">
                            <label for="departamentos"
                                class="text-sm sm:text-base font-bold w-[100%] sm:w-[60%]  text-gray-900 text-white mr-2">Departamento:</label>
                            <select name="departamentos" id="departamentos"
                                class="bg-[#db4900] border-orange-300 text-gray-900 text-xs sm:text-sm font-bold  rounded-3xl focus:ring-orange-500 focus:border-orange-500 block w-full sm:w-full lg:w-[78%] sm:ml-[4%] sm:text-sm md:text-xs sm:text-sm p-2.5 dark:bg-orange-600 border-orange-500 placeholder-white-400 text-white"
                                th:field="*{departamentos}" required>
                                <option value="" selected>Seleccionar departamento</option>
                                <option th:each="departamento : ${departamentos}"
                                    th:value="${departamento.name_departament}"
                                    th:text="${departamento.name_departament}">Nombre del Departamento</option>
                            </select>
                        </div>

                    </div>


                    <!-- Tercera fila -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div class="flex items-center mb-3">
                            <label for="fechaEntrega" class="text-sm sm:text-base font-bold w-[90%] sm:w-[60%]  text-gray-900 text-white mr-1">Fecha de
                                Entrega:</label>
                            <input type="date" id="fechaEntrega" name="fechaEntrega"
                                class="bg-[#db4900] border border-orange-300 text-white-900 text-xs sm:text-sm font-bold  rounded-3xl focus:ring-orange-500 focus:border-orange-500 block w-full sm:w-full sm:ml-[4%] sm:text-sm md:text-xs sm:text-sm p-2.5 dark:bg-orange-600 border-orange-500 placeholder-orange-400 text-white"
                                th:field="*{fechaEntrega}" required>
                        </div>
                        <div class="flex items-center mb-3">
                            <label for="procesos"
                                class="text-sm sm:text-base font-bold w-[100%] sm:w-[60%]  text-gray-900 text-white mr-2">Proceso:</label>
                            <select name="procesos" id="procesos"
                                class="bg-[#db4900] border-orange-300 text-gray-900 text-xs sm:text-sm font-bold  rounded-3xl focus:ring-orange-500 focus:border-orange-500 block w-full lg:w-[79%] sm:w-full sm:ml-[4%] sm:text-sm md:text-xs sm:text-sm p-2.5 dark:bg-orange-600 border-orange-500 placeholder-white-400 text-white"
                                th:field="*{procesos}" required onchange="actualizarColores()">
                                <option value="" selected>Seleccione el proceso</option>
                                <option value="blench">Blench</option>
                                <option value="stone medio">Stone Medio</option>
                                <option value="stone alto">Stone Alto</option>
                                <option value="destroyer">Destroyer</option>
                                <option value="teñido">Teñido</option>
                                <option value="suavizado">Suavizado</option>
                            </select>
                        </div>
                        
                        <!-- Contenedor para colores -->
                        <div id="contenedorColores" class="grid grid-cols-1 sm:grid-cols-1 gap-6"></div>
                        

                    </div>

                    <!-- Botones -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 place-items-center">
                        <!-- Botón de Borrar -->
                        <button type="button" id="boton-borrar" onclick="document.getElementById('formulario').reset();"
                            class="py-4 w-[65%] md:w-[50%]  text-white bg-[#db4900] hover:bg-[#ff5500] focus:ring-4 focus:ring-[#e8763d] focus:outline-none  rounded-3xl text-sm sm:text-base font-bold  py-2.5 text-center dark:bg-orange-600 dark:hover:bg-orange-700 dark:focus:ring-orange-800 bg-[#db4900]">
                            Borrar
                        </button>
                        <!-- Botón de Siguiente -->
                        <button type="submit" id="boton-siguiente"
                            class="py-4 w-[65%] md:w-[50%] text-white bg-[#db4900] hover:bg-[#ff5500] focus:ring-4 focus:ring-[#e8763d] focus:outline-none  rounded-3xl text-sm sm:text-base font-bold  py-2.5 text-center dark:bg-orange-600 dark:hover:bg-orange-700 dark:focus:ring-orange-800 bg-[#db4900]">
                            Siguiente
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="/js/validation.js"></script>
    <script src="/js/dinamic.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</body>

</html>
